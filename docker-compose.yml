services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civicai
      POSTGRES_USER: civicai
      POSTGRES_PASSWORD: civicai-demo-only
    ports:
      - "5432:5432"
    volumes:
      - civicai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicai -d civicai"]
      interval: 5s
      timeout: 4s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://civicai:civicai-demo-only@db:5432/civicai
      SECRET_KEY: change-this-session-secret
      JWT_SECRET_KEY: change-this-jwt-secret
      CIVICAI_SEED_DEMO: "1"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  civicai-postgres:
