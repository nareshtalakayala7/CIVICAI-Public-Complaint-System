<div class="timeline">{% for item in complaint.history %}<div class="timeline-item {{ 'current' if loop.last }}"><span class="timeline-icon"><i class="bi {{ 'bi-check2' if item.new_status == 'Resolved' else 'bi-x-lg' if item.new_status == 'Rejected' else 'bi-arrow-repeat' if item.new_status == 'In Progress' else 'bi-circle-fill' }}"></i></span><div class="timeline-copy"><div><b>{{ item.new_status }}</b><span class="timeline-role">{{ item.changed_by_role|title }}</span></div><p>{{ item.note or 'Status updated.' }}</p><small>{{ item.created_at|dt }}</small></div></div>{% else %}<p class="muted-text">No status history yet.</p>{% endfor %}</div>
